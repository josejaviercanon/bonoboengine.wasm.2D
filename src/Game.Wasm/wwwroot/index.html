<!DOCTYPE html>
<html lang="en">
<head>
    <title>BonoboGame.Wasm</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="stylesheet" href="_content/Game.UI/dist/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body class="bg-slate-950 m-0 p-0 overflow-hidden">
    <!-- Blazor WASM mounts the App component tree here. -->
    <div id="app">Loading...</div>

    <!-- C# → JS bridge (ADR-007 Phase 2): float32 signal buffers + command routing. -->
    <script>
        var _provider = null;
        var _commandRef = null;
        var _pendingCommands = [];

        function dispatchFloats(eventName, floats) {
            if (_provider && _provider._listeners) {
                var cbs = _provider._listeners[eventName];
                if (cbs) {
                    for (var i = 0; i < cbs.length; i++) cbs[i](floats);
                }
            }
        }

        // DirectRenderTransport delivers (eventName, bytes, floatCount). The bytes
        // arrive as a Uint8Array via Blazor's optimized byte-array interop (a
        // base64 string is tolerated as a fallback); the Float32Array view over
        // the same memory is handed straight to the scene's buffer listener —
        // no JSON, no per-entity interop.
        window.onRenderSignalBuffer = function (eventName, data, floatCount) {
            var bytes = data;
            if (typeof bytes === 'string') {
                var bin = atob(bytes);
                bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            }
            if (!bytes || !bytes.buffer) return;
            dispatchFloats(eventName, new Float32Array(bytes.buffer, bytes.byteOffset, floatCount));
        };

        function postCommand(path, bodyJson) {
            if (_commandRef) {
                _commandRef.invokeMethodAsync('HandleCommand', path, bodyJson || null);
            } else {
                // Blazor may still be booting when the scene connects — queue the
                // command and flush once the .NET reference is registered.
                _pendingCommands.push([path, bodyJson || null]);
            }
            return Promise.resolve();
        }

        window.registerGameWasmProvider = function (dotNetRef) {
            _commandRef = dotNetRef;
            if (!_provider) {
                _provider = {
                    _listeners: {},
                    // Registration contract (LocalBufferProvider.onSignal): the
                    // compiled scenes call this from SignalStream.addBufferListener
                    // to subscribe; onRenderSignalBuffer dispatches into the list.
                    onSignal: function (eventName, onData) {
                        if (!this._listeners[eventName]) this._listeners[eventName] = [];
                        this._listeners[eventName].push(onData);
                    },
                    postCommand: postCommand,
                    close: function () { }
                };
            }
            // The PixiJS module bundle dispatches 'pixi-bundle-ready' once it has
            // attached window.registerLocalBufferProvider (see game.ts). Waiting on
            // the event (with a polling fallback) replaces the previous fixed
            // 50 ms retry loop.
            var attach = function () {
                window.registerLocalBufferProvider(_provider);
                console.log('[Game.Wasm] provider registered');
            };
            if (typeof window.registerLocalBufferProvider === 'function') {
                attach();
            } else {
                window.addEventListener('pixi-bundle-ready', attach, { once: true });
                var attempts = 0;
                (function poll() {
                    if (typeof window.registerLocalBufferProvider === 'function') {
                        window.removeEventListener('pixi-bundle-ready', attach);
                        attach();
                    } else if (++attempts < 200) {
                        setTimeout(poll, 50);
                    } else {
                        console.error('[Game.Wasm] registerLocalBufferProvider never appeared (10s)');
                    }
                })();
            }
            for (var i = 0; i < _pendingCommands.length; i++) {
                _commandRef.invokeMethodAsync('HandleCommand', _pendingCommands[i][0], _pendingCommands[i][1]);
            }
            _pendingCommands.length = 0;
        };

        window.addEventListener('beforeunload', function () {
            _commandRef = null;
            _provider = null;
        });
    </script>

    <!-- Same PixiJS bundle as Game.Web (shared local-buffer build). -->
    <script type="module" src="_content/Game.UI/dist/game-bundle.js"></script>

    <!--
        WASM bootstrap: Blazor boots first and renders App.razor (which creates
        #pixi-viewport[data-message] inside #app). The bundle dispatches
        'pixi-bundle-ready' once its globals exist; this waits for that event and
        the viewport element before starting PixiJS. In WASM mode there is no SSR
        payload, so data-message is empty — fall back to a default tetris scene.
    -->
    <script>
        function startPixi() {
            var viewport = document.getElementById('pixi-viewport');
            if (!viewport) {
                console.warn('[pixi-debug] #pixi-viewport NOT found in DOM');
                return;
            }
            var message = viewport.getAttribute('data-message') || '';
            if (!message) message = '{"exampleId":"games/tetris"}';
            console.log('[pixi-debug] #pixi-viewport found, data-message =', JSON.stringify(message));
            initGame('pixi-viewport')
                .then(function () {
                    if (typeof renderScene !== 'function') {
                        console.error('[pixi-debug] renderScene is not defined');
                        return;
                    }
                    renderScene(message);
                })
                .catch(function (err) {
                    console.error('[pixi-debug] initGame failed:', err);
                });
        }

        window.addEventListener('load', function () {
            if (typeof initGame === 'function' && document.getElementById('pixi-viewport')) {
                startPixi();
                return;
            }
            var attempts = 0;
            (function waitForBundle() {
                if (typeof initGame === 'function' && document.getElementById('pixi-viewport')) {
                    startPixi();
                } else if (++attempts < 300) {
                    setTimeout(waitForBundle, 50);
                } else {
                    console.error('[pixi-debug] initGame or #pixi-viewport not available after 15s');
                }
            })();
        });
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>Blazor.start();</script>
</body>

</html>
